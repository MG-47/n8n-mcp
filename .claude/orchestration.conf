# Multi-model orchestration settings (sourced by .claude/scripts/* and .claude/hooks/*).
# Roles: Opus = orchestrator/planner, Sonnet = workers, Fable = escalation only,
# Sol (Codex CLI) = read-only diff reviewer.

OPUS_MODEL="claude-opus-5-5"
SONNET_MODEL="claude-sonnet-5-5"
FABLE_MODEL="claude-fable-5-1"

# Codex model slug for the reviewer. Change here if the slug differs on your account.
SOL_MODEL="${SOL_MODEL:-gpt-6.1-sol}"
SOL_REASONING_EFFORT="${SOL_REASONING_EFFORT:-high}"
SOL_TIMEOUT_SECS="${SOL_TIMEOUT_SECS:-900}"

# Review rounds allowed per task before the loop must stop and ask the user.
MAX_REVIEW_ROUNDS="${MAX_REVIEW_ROUNDS:-6}"
# Consecutive FAIL rounds repeating the same finding that make Fable escalation eligible.
ESCALATE_AFTER_REPEATS="${ESCALATE_AFTER_REPEATS:-2}"
# Files above this size are left out of the reviewer snapshot.
SNAPSHOT_MAX_FILE_BYTES="${SNAPSHOT_MAX_FILE_BYTES:-5242880}"
